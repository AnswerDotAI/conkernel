[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conkernel"
dynamic = ["version"]
description = "A persistent Jupyter kernel workbench for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "conkernel contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "fastcore",
  "conkernelclient",
  "mcp",
]

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "twine",
  "pytest",
  "pytest-asyncio",
  "pytest-xdist",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/conkernel"

[project.scripts]
conkernel = "conkernel.cli:main"
conkernel-mcp = "conkernel.mcp:main"

[tool.pytest.ini_options]
addopts = "-n 3 --dist=loadfile"
timeout = 90
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "conkernel.__version__" }

[tool.setuptools.packages.find]
include = ["conkernel"]
